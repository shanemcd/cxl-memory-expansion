# Node-0-pinned 2MiB hugepage pool for the memory-tier DRAM island.
#
# NOTE: do NOT add ordering drop-ins for cxl-region-commit.service here.
# That unit is WantedBy=multi-user.target AND After=multi-user.target; adding
# Before=kubelet.service via a drop-in closes an ordering cycle at boot
# (kubelet -> ... -> multi-user.target -> region-commit -> kubelet), and
# systemd then DELETES the region-commit start job to break the cycle —
# the CXL region never commits and node 1 comes up memoryless.
# region-commit and kubelet may start in parallel; the DRA driver publishes
# topology at runtime, so kubelet does not need the region at its own start.
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: worker-cxl
  name: 50-memorytier-hugepages-node0
spec:
  config:
    ignition:
      version: 3.2.0
    systemd:
      units:
      - name: memorytier-hugepages-node0.service
        enabled: true
        contents: |
          [Unit]
          Description=Allocate node-0-pinned 2Mi hugepage pool (memory-tier DRAM island)
          # kubelet reads hugepage capacity once at startup; the pool must
          # exist before it does.
          Before=kubelet.service
          After=local-fs.target
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/sh -c '/usr/bin/echo 1024 > /sys/devices/system/node/node0/hugepages/hugepages-2048kB/nr_hugepages && /usr/bin/echo "node0 2Mi pool: $(/usr/bin/cat /sys/devices/system/node/node0/hugepages/hugepages-2048kB/nr_hugepages) pages"'
          [Install]
          WantedBy=multi-user.target
